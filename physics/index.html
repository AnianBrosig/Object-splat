<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Object shelf</title>
<script type="importmap">{"imports": {"three": "./vendor/three.module.js"}}</script>
<style>
  html, body { margin: 0; height: 100%; background: #15171b; color: #e6e6e6; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; }
  #ui { position: fixed; left: 14px; top: 14px; width: 270px; background: rgba(24,26,31,.88); border: 1px solid #343842;
        border-radius: 10px; padding: 12px 14px; backdrop-filter: blur(6px); }
  h1 { font-size: 15px; margin: 0 0 8px; font-weight: 650; }
  button { background: #2c3340; color: #eee; border: 1px solid #3d4453; border-radius: 7px; padding: 7px 12px; cursor: pointer; font: inherit; }
  button:hover { background: #374052; }
  button.primary { background: #2f6fed; border-color: #2f6fed; color: #fff; font-weight: 600; }
  button.primary:hover { background: #3f7df5; }
  button.on { background: #d4572f; border-color: #d4572f; color: #fff; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
  label { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 6px 0; color: #b9bdc7; }
  input[type=range] { width: 140px; }
  .muted { color: #8b909c; font-size: 12px; }
  #angle { font-variant-numeric: tabular-nums; }
  #objs a { color: #8fb3ff; text-decoration: none; margin-right: 6px; }
  #objs div { margin: 3px 0; }
  #err { color: #ff8b8b; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="ui">
  <h1>Object shelf</h1>
  <div class="row">
    <button id="tilt" class="primary">Tilt shelf</button>
    <button id="shake">Shake</button>
    <button id="drop">Drop another</button>
    <button id="reset">Reset</button>
  </div>
  <label>Tilt angle <span><input id="max" type="range" min="15" max="75" value="50"> <span id="maxv">50</span>&deg;</span></label>
  <label>Tilt speed <span><input id="spd" type="range" min="5" max="60" value="20"> <span id="spdv">20</span>&deg;/s</span></label>
  <label>Time <span><input id="ts" type="range" min="0.2" max="2" step="0.1" value="1"> <span id="tsv">1.0</span>x</span></label>
  <div class="muted">shelf angle <b id="angle">0.0&deg;</b> &middot; drag to orbit, wheel to zoom</div>
  <div id="objs" class="muted" style="margin-top:8px"></div>
  <div id="err"></div>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
